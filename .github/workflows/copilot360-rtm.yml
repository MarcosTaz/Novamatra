name: COPILOT 360 RTM-SF
on:
  pull_request:
    paths:
      - 'docs/copilot360/**'
      - 'tools/copilot360/**'
      - 'tests/copilot360/**'
      - '.github/workflows/copilot360-rtm.yml'
  push:
    paths:
      - 'docs/copilot360/**'
      - 'tools/copilot360/**'
      - 'tests/copilot360/**'
      - '.github/workflows/copilot360-rtm.yml'
  workflow_dispatch:
jobs:
  rtm-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: RTM-SF evidence integrity
        run: python tools/copilot360/validate_rtm.py docs/copilot360/rtm_sf_v1.json docs/copilot360/evidence_manifest.json
      - name: Unit tests
        run: python -m unittest discover -s tests/copilot360 -p 'test_*.py' -v
